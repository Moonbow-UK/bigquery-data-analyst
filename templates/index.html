<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BigQuery Dataset Summary</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    h1 { margin-bottom: 0.5rem; }
    form { margin-bottom: 2rem; padding: 1rem; border: 1px solid #ccc; border-radius: 6px; display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
    .form-field { display: flex; flex-direction: column; gap: 0.4rem; min-width: 200px; }
    .form-field label { font-weight: bold; margin-bottom: 0; }
    .form-field small { color: #555; font-size: 0.85rem; }
    .form-field--checkbox { flex-direction: column; align-items: flex-start; }
    .form-field--checkbox label { font-weight: 600; display: inline-flex; align-items: center; gap: 0.35rem; }
    .form-field--checkbox input[type="checkbox"] { margin: 0; }
    select, input[type="date"] { padding: 0.4rem; border: 1px solid #bbb; border-radius: 4px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; }
    th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; vertical-align: top; }
    th { background-color: #f0f0f0; }
    .error { color: #b00020; margin-bottom: 1rem; }
    .note { color: #00695c; margin-bottom: 1rem; }
    details { margin-bottom: 1.5rem; }
    summary { font-weight: bold; cursor: pointer; }
    code { background-color: #f6f8fa; padding: 0.1rem 0.3rem; border-radius: 3px; }
    .hidden-row { display: none; }
    .toggle-link {
      margin-top: -0.2rem;
      padding: 0;
      border: none;
      background: none;
      color: #1976d2;
      cursor: pointer;
      font: inherit;
      float: right;
    }
    .toggle-link:hover { text-decoration: underline; }
    .toggle-link:focus { outline: 1px dotted #1976d2; }
    .table-note { margin: -0.4rem 0 0.8rem; color: #555; font-size: 0.9rem; }
    .progress-panel { border: 1px solid #d0d7de; border-radius: 6px; padding: 1rem; margin-bottom: 1.5rem; background: #f8fafc; }
    .progress-panel[hidden] { display: none !important; }
    .progress-bar { height: 10px; background: #e0e7ef; border-radius: 999px; overflow: hidden; margin-bottom: 0.75rem; position: relative; }
    .progress-bar__fill { height: 100%; width: 0; background: #1976d2; transition: width 0.25s ease; }
    .progress-message { margin: 0 0 0.6rem; font-weight: 600; color: #0b3d91; }
    .progress-steps { list-style: none; margin: 0; padding: 0; color: #374151; font-size: 0.95rem; display: grid; gap: 0.35rem; }
    .progress-steps li { position: relative; padding-left: 1.2rem; }
    .progress-steps li::before { content: '•'; position: absolute; left: 0; color: #1976d2; }
    .is-loading { opacity: 0.5; transition: opacity 0.2s ease; }
  </style>
</head>
<body>
  <h1>BigQuery Dataset Summary</h1>

  <div id="error-container">
    {% if error_message %}
      <div class="error">{{ error_message }}</div>
    {% endif %}
  </div>

  <form method="post" data-summary-form="true">
    <div class="form-field">
      <label for="date_range">Date range</label>
      <select id="date_range" name="date_range">
        <option value="today" {% if selected_date_range == 'today' %}selected{% endif %}>Today</option>
        <option value="yesterday" {% if selected_date_range == 'yesterday' %}selected{% endif %}>Yesterday</option>
        {% set week_days = form.week_days or 7 %}
        <option value="last7days" {% if selected_date_range == 'last7days' %}selected{% endif %}>
          Last {{ week_days }} day{% if week_days != 1 %}s{% endif %}
        </option>
      </select>
    </div>
    <div class="form-field">
      <label for="custom_date">Specific date</label>
      <input
        type="date"
        id="custom_date"
        name="custom_date"
        value="{% if selected_specific_date %}{{ selected_specific_date }}{% endif %}"
        max="{{ current_date }}"
        aria-describedby="custom-date-hint"
      />
      <small id="custom-date-hint">Leave blank to use the date range above.</small>
    </div>
    <div class="form-field form-field--checkbox">
      <label for="force_refresh">
        <input
          type="checkbox"
          id="force_refresh"
          name="force_refresh"
          {% if force_refresh_checked %}checked{% endif %}
        />
        Force refresh
      </label>
      <small>Skip cached summaries and pull fresh data when selected.</small>
    </div>
    <button type="submit" name="action" value="generate">Generate summary</button>
  </form>

  <section id="progress-panel" class="progress-panel" aria-live="polite" hidden>
    <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar__fill" id="progress-bar-fill"></div>
    </div>
    <p class="progress-message" id="progress-message">Preparing…</p>
    <ul class="progress-steps" id="progress-steps" aria-live="polite" aria-atomic="false"></ul>
  </section>

  <div id="summary-output">
    {% if summary_generated and summary %}
      {% include "summary_content.html" %}
    {% endif %}
  </div>

  <script>
    (function () {
      function attachToggleHandlers(root) {
        if (!root) {
          return;
        }
        root.querySelectorAll('[data-toggle-target]').forEach(function (button) {
          if (button.dataset.toggleBound === 'true') {
            return;
          }
          button.dataset.toggleBound = 'true';
          button.addEventListener('click', function () {
            var targetId = button.getAttribute('data-toggle-target');
            var rows = root.querySelectorAll('[data-section-id="' + targetId + '"][data-collapsible="true"]');
            if (!rows.length) {
              return;
            }
            var expanded = button.getAttribute('aria-expanded') === 'true';
            rows.forEach(function (row) {
              if (expanded) {
                row.classList.add('hidden-row');
              } else {
                row.classList.remove('hidden-row');
              }
            });
            button.setAttribute('aria-expanded', expanded ? 'false' : 'true');
            button.textContent = expanded ? 'Show more' : 'Show less';
          });
        });
      }

      document.addEventListener('DOMContentLoaded', function () {
        attachToggleHandlers(document);
      });

      var form = document.querySelector('[data-summary-form]');
      if (!form || !window.fetch || typeof ReadableStream === 'undefined' || typeof TextDecoder === 'undefined') {
        return;
      }

      var submitButton = form.querySelector('button[type="submit"]');
      var progressPanel = document.getElementById('progress-panel');
      var progressBar = document.getElementById('progress-bar');
      var progressFill = document.getElementById('progress-bar-fill');
      var progressMessage = document.getElementById('progress-message');
      var progressSteps = document.getElementById('progress-steps');
      var summaryOutput = document.getElementById('summary-output');
      var errorContainer = document.getElementById('error-container');
      var dateRangeSelect = form.querySelector('#date_range');
      var customDateInput = form.querySelector('#custom_date');
      var forceRefreshInput = form.querySelector('#force_refresh');

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var specificDate = customDateInput && customDateInput.value ? customDateInput.value : '';
        var rangeValue = specificDate ? 'date:' + specificDate : (dateRangeSelect ? dateRangeSelect.value : 'today');
        var forceRefresh = forceRefreshInput && forceRefreshInput.checked;
        startSummaryRequest(
          {
            date_range: rangeValue,
            custom_date: specificDate || undefined,
            force_refresh: forceRefresh
          },
          {
            checkAvailability: !forceRefresh && Boolean(specificDate),
            forceRefresh: forceRefresh
          }
        );
      });

      async function startSummaryRequest(payload, options) {
        var opts = options || {};
        var specificDate = payload && payload.custom_date ? String(payload.custom_date) : '';
        var forceRefresh = Boolean(opts.forceRefresh);
        errorContainer.innerHTML = '';
        var availability;

        if (forceRefresh) {
          payload.force_refresh = true;
        }

        if (!forceRefresh && specificDate && opts.checkAvailability !== false) {
          try {
            availability = await checkSummaryAvailability(specificDate);
          } catch (availabilityError) {
            showError(
              availabilityError && availabilityError.message
                ? availabilityError.message
                : 'Unable to verify summary availability.'
            );
            return;
          }
          if (availability && availability.range_key) {
            payload.date_range = availability.range_key;
          }
          if (!availability || availability.available !== true) {
            var confirmMessage = 'No cached summary found for ' + specificDate + '. Connect to BigQuery and fetch it now?';
            var shouldProceed = window.confirm(confirmMessage);
            if (!shouldProceed) {
              return;
            }
          }
        }

        if (submitButton) {
          submitButton.disabled = true;
        }
        progressSteps.innerHTML = '';
        progressPanel.hidden = false;
        summaryOutput.classList.add('is-loading');
        updateProgress(0.02, 'Preparing summary request…');

        fetchSummary(payload)
          .catch(function (error) {
            showError(error && error.message ? error.message : 'Failed to generate summary.');
          })
          .finally(function () {
            summaryOutput.classList.remove('is-loading');
            if (submitButton) {
              submitButton.disabled = false;
            }
          });
      }

      async function checkSummaryAvailability(dateValue) {
        var response;
        try {
          response = await fetch('/api/check-summary', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date: dateValue })
          });
        } catch (networkError) {
          throw new Error('Network error while checking summary availability.');
        }

        var payload = null;
        try {
          payload = await response.json();
        } catch (parseError) {
          payload = null;
        }

        if (!response.ok) {
          var message = payload && payload.error ? payload.error : 'Failed to check summary availability.';
          throw new Error(message);
        }
        return payload || {};
      }

      function updateProgress(progressValue, message) {
        var value = Math.max(0, Math.min(progressValue || 0, 1));
        var percent = Math.round(value * 100);
        progressFill.style.width = Math.max(2, Math.min(percent, 100)) + '%';
        progressBar.setAttribute('aria-valuenow', String(percent));
        progressMessage.textContent = message || 'Working…';
      }

      function addStep(message) {
        if (!message) {
          return;
        }
        var item = document.createElement('li');
        item.textContent = message;
        progressSteps.appendChild(item);
      }

      function showError(message) {
        progressPanel.hidden = true;
        var errorBlock = document.createElement('div');
        errorBlock.className = 'error';
        errorBlock.textContent = message;
        errorContainer.innerHTML = '';
        errorContainer.appendChild(errorBlock);
      }

      function renderSummary(html) {
        if (typeof html === 'string') {
          summaryOutput.innerHTML = html;
          attachToggleHandlers(summaryOutput);
        }
        progressPanel.hidden = true;
      }

      async function fetchSummary(payload) {
        var response;
        try {
          response = await fetch('/api/progress-summary', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
        } catch (networkError) {
          throw new Error('Network error while requesting summary.');
        }

        if (!response.ok) {
          throw new Error('Request failed (' + response.status + ').');
        }
        if (!response.body || typeof response.body.getReader !== 'function') {
          throw new Error('Streaming responses are not supported in this browser.');
        }

        var reader = response.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';
        var completed = false;
        var errorMessage = null;

        while (true) {
          var result = await reader.read();
          if (result.done) {
            break;
          }
          buffer += decoder.decode(result.value, { stream: true });
          var newlineIndex;
          while ((newlineIndex = buffer.indexOf('\n')) >= 0) {
            var line = buffer.slice(0, newlineIndex).trim();
            buffer = buffer.slice(newlineIndex + 1);
            if (!line) {
              continue;
            }
            var eventData;
            try {
              eventData = JSON.parse(line);
            } catch (parseError) {
              continue;
            }

            if (eventData.type === 'status') {
              updateProgress(eventData.progress, eventData.message);
            } else if (eventData.type === 'note') {
              addStep(eventData.message);
            } else if (eventData.type === 'complete') {
              completed = true;
              updateProgress(1, 'Summary ready.');
              renderSummary(eventData.html);
            } else if (eventData.type === 'error') {
              errorMessage = eventData.message || 'Summary generation failed.';
            }
          }

          if (errorMessage) {
            break;
          }
        }

        if (errorMessage) {
          throw new Error(errorMessage);
        }
        if (!completed) {
          throw new Error('Summary stream ended unexpectedly.');
        }
      }
    })();
  </script>
</body>
</html>
